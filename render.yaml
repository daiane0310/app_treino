services:
  - type: web
    name: app-treino-backend
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
